spring.application.name=campusswap
server.port=8080

# ---------- Database (H2 file DB: no install needed) ----------
spring.datasource.url=jdbc:h2:file:./data/campusswap
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- MySQL alternative (uncomment, remove the H2 lines above) ----------
# spring.datasource.url=jdbc:mysql://localhost:3306/campusswap?createDatabaseIfNotExist=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

# ---------- JWT ----------
# Override with an env var in any real deployment (min 32 characters).
app.jwt.secret=${JWT_SECRET:campusswap-dev-secret-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ---------- CORS (comma separated origin patterns; "*" is for local dev only) ----------
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ---------- Demo data (demo user from the frontend README + a few items) ----------
app.seed-demo-data=true

spring.jackson.default-property-inclusion=non_null
